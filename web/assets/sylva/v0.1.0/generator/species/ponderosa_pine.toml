id = "ponderosa_pine"
common = "Ponderosa Pine"
latin = "Pinus ponderosa var. scopulorum"
group = "evergreen"
habitat = "Sunny, dry elevations around town; open park-like stands with grass beneath."
elevation_m = [2000, 2800]
fall_note = "Evergreen. Older needles yellow and drop in autumn; mature bark warms to cinnamon-orange in low sun."
silhouette_cues = [
  "Tall, straight, clear bole; open, irregular crown that flattens with age",
  "Branches thick, few, horizontal to drooping with upturned ends",
  "Needles in dense bottle-brush tufts at branch tips only",
  "Mature bark: large cinnamon-orange jigsaw plates split by black furrows; young trees dark ('blackjack')",
]
sources = [
  { title = "USU Forestry: Ponderosa Pine identification", url = "https://extension.usu.edu/forestry/tree-identification/pines/ponderosa-pine" },
  { title = "NC State Extension: Pinus ponderosa", url = "https://plants.ces.ncsu.edu/plants/all/pinus-ponderosa/" },
  { title = "Wikimedia Commons: Pinus ponderosa", url = "https://commons.wikimedia.org/wiki/Category:Pinus_ponderosa" },
]

