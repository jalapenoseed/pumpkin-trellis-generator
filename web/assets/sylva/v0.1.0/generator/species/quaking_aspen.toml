id = "quaking_aspen"
common = "Quaking Aspen"
latin = "Populus tremuloides"
group = "deciduous"
habitat = "High-elevation slopes and passes (e.g. Wolf Creek Pass); clonal stands of hundreds of stems from one root system."
elevation_m = [2400, 3400]
fall_note = "Clone-synchronous gold; whole hillsides turn at once, with occasional orange to red clones."
silhouette_cues = [
  "Tall, straight, clean white boles: self-pruned to half height or more",
  "Short, narrow, rounded crown that sits on top like a lollipop",
  "Branches short and upswept; crown reads light, never dense",
  "Black 'eye' branch scars and dark, rough bark at the base",
  "Leaves on flattened petioles: they flutter edge-on in the faintest breeze",
]
sources = [
  { title = "Virginia Tech Dendrology: Quaking aspen factsheet", url = "https://dendro.cnre.vt.edu/dendrology/syllabus/factsheet.cfm?ID=160" },
  { title = "Pagosa Outside: Top 10 places to see fall colors near Pagosa Springs", url = "https://pagosaoutside.com/blog/top-10-places-to-see-the-fall-colors-near-pagosa-springs-2" },
  { title = "Pagosa Sun: What causes our beautiful fall landscape", url = "https://pagosasun.com/stories/what-causes-our-beautiful-fall-landscape,1673" },
  { title = "Wikimedia Commons: Populus tremuloides (photo library)", url = "https://commons.wikimedia.org/wiki/Category:Populus_tremuloides" },
]

