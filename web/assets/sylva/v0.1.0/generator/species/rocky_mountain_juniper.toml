id = "rocky_mountain_juniper"
common = "Rocky Mountain Juniper"
latin = "Juniperus scopulorum (Utah juniper, J. osteosperma, shares the scrub)"
group = "evergreen"
habitat = "Dry, low-elevation scrub and rocky ridges around Chimney Rock; pinyon-juniper woodland."
elevation_m = [1500, 2700]
fall_note = "Evergreen; glaucous blue berry-cones peak in autumn, foliage bronzes slightly in winter."
silhouette_cues = [
  "Small tree 6-12 m; dense narrow pyramid when young, twisted and irregular with age",
  "Often several trunks; long branches reaching upward",
  "Foliage is braided cords of tiny overlapping scales, not needles",
  "Reddish-brown under-bark that shreds into long fibrous strips",
  "Dark blue, waxy-bloomed berry-like cones",
]
sources = [
  { title = "NDSU Tree Handbook: Rocky Mountain juniper", url = "https://www.ag.ndsu.edu/trees/handbook/th-3-157.pdf" },
  { title = "USU Range Plants: Rocky Mountain Juniper", url = "https://extension.usu.edu/rangeplants/shrubs-and-trees/cedar-red" },
  { title = "Chimney Rock: Puebloan resources - trees & shrubs", url = "https://www.chimneyrockco.org/puebloan-resources/trees-shrubs/" },
  { title = "Wikimedia Commons: Juniperus scopulorum", url = "https://commons.wikimedia.org/wiki/Category:Juniperus_scopulorum" },
]

