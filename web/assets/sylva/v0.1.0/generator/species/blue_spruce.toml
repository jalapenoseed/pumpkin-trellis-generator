id = "blue_spruce"
common = "Colorado Blue Spruce"
latin = "Picea pungens"
group = "evergreen"
habitat = "Stream bottoms and moist high-country slopes; silvery-blue canvas behind the aspen."
elevation_m = [2100, 3000]
fall_note = "Evergreen; waxy bloom is strongest on new growth and dulls through summer."
silhouette_cues = [
  "Dense, symmetrical cone when young; more open and ragged with age",
  "Stout horizontal branches in well-defined whorls; lower branches droop",
  "Stiff, sharp, four-sided needles radiate all round the shoot and curve upward",
  "Colour ranges dull green to steel-blue to near white on the same hillside",
  "Cones only in the top tenth to quarter of the crown",
]
sources = [
  { title = "Wikipedia: Blue spruce", url = "https://en.wikipedia.org/wiki/Blue_spruce" },
  { title = "Colorado Wildbuds: Picea pungens", url = "https://coloradowildbuds.com/picea-pungens.html" },
  { title = "Wikimedia Commons: Picea pungens", url = "https://commons.wikimedia.org/wiki/Category:Picea_pungens" },
]

