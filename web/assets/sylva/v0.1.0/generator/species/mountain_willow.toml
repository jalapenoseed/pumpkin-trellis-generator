id = "mountain_willow"
common = "Mountain Willow"
latin = "Salix monticola (and allied Salix spp.)"
group = "deciduous"
habitat = "Dense thickets along wet riverfronts, beaver meadows and alpine meadows."
elevation_m = [1800, 3100]
fall_note = "Deep, warm yellow; leafless stems glow red or yellow through winter."
silhouette_cues = [
  "Erect shrub 1.5-4 m in dense clumps of many slender stems",
  "Wand-like, nearly vertical stems; no single trunk",
  "Narrow lanceolate leaves clustered along the stems",
  "Stem colour is a key read: red-brown to yellow, glossy",
]
sources = [
  { title = "USFS FEIS: Salix monticola", url = "https://www.fs.usda.gov/database/feis/plants/shrub/salmot/all.html" },
  { title = "CSU Extension: Colorful winter stems", url = "https://extension.colostate.edu/resource/colorful-winter-stems" },
  { title = "Pagosa.com: Fall colors in Pagosa Springs", url = "https://pagosa.com/fall-colors-pagosa-springs-colorado/" },
  { title = "Wikimedia Commons: Salix monticola", url = "https://commons.wikimedia.org/wiki/Category:Salix_monticola" },
]

