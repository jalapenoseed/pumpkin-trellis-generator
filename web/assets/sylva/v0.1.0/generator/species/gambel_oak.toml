id = "gambel_oak"
common = "Gambel Oak (Scrub Oak)"
latin = "Quercus gambelii"
group = "deciduous"
habitat = "Lower-to-mid elevation hillsides and rocky pastures; dense clonal thickets with open gaps, spreading by root sprouts."
elevation_m = [1800, 2700]
fall_note = "Patchwork of golden-yellow, russet-orange and copper-red; dead brown leaves often hang on into winter."
silhouette_cues = [
  "Usually a shrubby, clump-forming thicket 2-5 m; occasionally a small tree",
  "Crooked, zig-zag limbs; dense rounded mounds",
  "Thick, glossy, deeply round-lobed leaves (7-9 lobes)",
  "Gray-brown, scaly-platy bark",
]
sources = [
  { title = "USU Tree Browser: Oak, Gambel / Scrub / Rocky Mtn. White", url = "https://extension.usu.edu/treebrowser/catalog/oak-gambel-scrub-rockymt-white" },
  { title = "USU Range Plants: Gambel Oak", url = "https://extension.usu.edu/rangeplants/shrubs-and-trees/gambel-oak.php" },
  { title = "KDVR: Which trees turn which colors in Colorado", url = "https://kdvr.com/denver-guide/fall/colors/which-trees-turn-which-colors-in-colorado/" },
  { title = "Pagosa.com: Fall colors in Pagosa Springs", url = "https://pagosa.com/fall-colors-pagosa-springs-colorado/" },
  { title = "Wikimedia Commons: Quercus gambelii", url = "https://commons.wikimedia.org/wiki/Category:Quercus_gambelii" },
]

