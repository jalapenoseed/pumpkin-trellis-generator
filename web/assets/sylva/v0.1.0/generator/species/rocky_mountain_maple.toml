id = "rocky_mountain_maple"
common = "Rocky Mountain Maple"
latin = "Acer glabrum"
group = "deciduous"
habitat = "Moist canyons, stream banks and lower mountain slopes; tucked under conifers."
elevation_m = [1800, 3000]
fall_note = "Rare bursts of vivid orange and bright red against the conifers; some plants only go yellow."
silhouette_cues = [
  "Small multi-stemmed shrubby tree 3-9 m with a rounded crown",
  "Opposite branching (pairs) - reads very differently from the alternate poplars",
  "3-lobed, sharply double-toothed leaves on long red petioles",
  "Thin, smooth red-brown bark; red twigs and buds",
]
sources = [
  { title = "USU Tree Browser: Maple, Rocky Mountain", url = "https://extension.usu.edu/treebrowser/catalog/maple-rocky-mountain" },
  { title = "WSU: Acer glabrum description", url = "https://public.wsu.edu/~lohr/wcl/trees/acerglab/wacgldes.html" },
  { title = "Pagosa Daily Post: So many colorful trees, so little time", url = "https://pagosadailypost.com/2021/09/30/so-many-colorful-trees-so-little-time/" },
  { title = "Wikimedia Commons: Acer glabrum", url = "https://commons.wikimedia.org/wiki/Category:Acer_glabrum" },
]

