id = "pinyon_pine"
common = "Two-needle Pinyon"
latin = "Pinus edulis"
group = "evergreen"
habitat = "Drier, low-elevation scrub such as Chimney Rock National Monument; pinyon-juniper woodland."
elevation_m = [1200, 2900]
fall_note = "Evergreen; grey-green. Cones open in early autumn to drop pine nuts."
silhouette_cues = [
  "Small, bushy tree 8-17 m (often far less on poor sites)",
  "Broad cone when young; spreading, flat-topped or rounded when old",
  "Short, crooked trunk dividing into several large crooked limbs",
  "Short stiff grey-green needles in pairs, often upcurved, clustered toward the shoot ends",
]
