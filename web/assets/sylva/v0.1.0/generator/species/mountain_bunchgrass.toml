id = "mountain_bunchgrass"
common = "Mountain Bunchgrass (Fescue / Muhly)"
latin = "Festuca thurberi, F. arizonica, Muhlenbergia montana (art-directed composite)"
group = "groundcover"
habitat = "Montane parks, ponderosa understory and slopes up to the alpine; tufts that cure in autumn."
elevation_m = [2100, 3600]
fall_note = "Dries into rust-red, deep orange, straw and soft brown that sweep across the slopes."
silhouette_cues = [
  "Dense tussock of fine, arching blades; fountain silhouette",
  "Seed stalks stand above the blade mound",
  "Colour gradient root to tip: greener / darker at the base, bleached tips",
]
sources = [
  { title = "Pagosa Daily Post: So many colorful trees, so little time", url = "https://pagosadailypost.com/2021/09/30/so-many-colorful-trees-so-little-time/" },
  { title = "Pagosa.com: Fall colors in Pagosa Springs", url = "https://pagosa.com/fall-colors-pagosa-springs-colorado/" },
  { title = "Wikimedia Commons: Festuca thurberi", url = "https://commons.wikimedia.org/wiki/Category:Festuca_thurberi" },
]

[form]
archetype = "clump"
height_m = [0.3, 0.7]

[clump]
