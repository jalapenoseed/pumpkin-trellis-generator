height_m = [0.3, 0.65]
width_cm = [0.2, 0.45]
base_radius_m = 0.07
splay_deg = [3, 42]
droop = 1.1
seed_heads = 9

[leaves]
kind = "blade"
outline = "grass_blade"
on_levels = []

[material]
