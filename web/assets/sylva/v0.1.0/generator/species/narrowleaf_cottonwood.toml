id = "narrowleaf_cottonwood"
common = "Narrowleaf Cottonwood"
latin = "Populus angustifolia"
group = "deciduous"
habitat = "Banks of the San Juan River and mountain streams; riparian galleries framing the water paths through town."
elevation_m = [1500, 2700]
fall_note = "Clear bright yellow canopies along the river."
silhouette_cues = [
  "Medium tree to ~18 m with a narrow, somewhat upright crown",
  "Willow-like lanceolate leaves on short petioles",
  "Smooth pale gray-green bark when young; thick, deep furrows with broad ridges when old",
  "Upswept limbs, slightly weeping twig ends",
]
sources = [
  { title = "Virginia Tech Dendrology: Narrowleaf cottonwood factsheet", url = "https://dendro.cnre.vt.edu/dendrology/syllabus/factsheet.cfm?ID=898" },
