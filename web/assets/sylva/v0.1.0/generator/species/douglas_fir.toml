id = "douglas_fir"
common = "Rocky Mountain Douglas-fir"
latin = "Pseudotsuga menziesii var. glauca"
group = "evergreen"
habitat = "Densely populated north slopes and the high country; the dark backdrop that makes aspen pop."
elevation_m = [2100, 3000]
fall_note = "Evergreen; dark blue-green year round."
silhouette_cues = [
  "Tall tapered spire with a long, limby trunk; becomes irregular with age",
  "Main branches angle upward more steeply than coastal Douglas-fir",
  "Soft flat needles spiral around twigs, forming dense hanging sprays",
  "Pendant cones with three-pronged bracts sticking out past the scales",
  "Mature bark very thick, deeply furrowed, dark reddish-brown",
]
sources = [
  { title = "NRCan Trees of Canada: Douglas-fir factsheet", url = "https://tidcf.nrcan.gc.ca/en/trees/factsheet/285" },
  { title = "Wild Utah: Rocky Mountain Douglas-fir", url = "https://wildutah.us/html/plants_scenery/h_fir_douglas.html" },
  { title = "Wikimedia Commons: Pseudotsuga menziesii var. glauca", url = "https://commons.wikimedia.org/wiki/Category:Pseudotsuga_menziesii_var._glauca" },
]

